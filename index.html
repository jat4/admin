<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Log In</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="auth-shell">
    <section id="loginView" class="card auth-card">
      <span class="eyebrow">ADMIN PORTAL</span>
      <h1>Admin Log In</h1>
      <p class="muted">
        Sign in with your authorized Supabase admin account.
      </p>

      <form id="loginForm">
        <label>
          Email
          <input
            type="email"
            name="email"
            required
            autocomplete="username"
          >
        </label>

        <label>
          Password
          <input
            type="password"
            name="password"
            required
            autocomplete="current-password"
          >
        </label>

        <button class="button" type="submit" id="loginButton">
          Log In
        </button>

        <p class="status" id="loginStatus"></p>
      </form>
    </section>

    <section id="dashboardView" class="dashboard hidden">
      <header class="topbar">
        <div>
          <span class="eyebrow">ADMIN INBOX</span>
          <h1>Applications</h1>
        </div>

        <button class="button secondary" id="logoutButton">
          Log Out
        </button>
      </header>

      <div class="layout">
        <aside class="card inbox">
          <div class="inbox-head">
            <strong>Inbox</strong>
            <span id="count">0</span>
          </div>

          <div id="applicationList"></div>
        </aside>

        <section class="card detail" id="detail">
          <div class="empty">
            Select an application from the inbox.
          </div>
        </section>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
